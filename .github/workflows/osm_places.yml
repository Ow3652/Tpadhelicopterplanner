# ดึงลานจอด ฮ./สนามบิน และยอดเขา (ประเทศไทย) จาก OpenStreetMap เป็น CSV → artifact + กิ่ง osm-data (แยกจาก main ไม่กระทบหน้าเว็บ)
name: OSM places
on:
  workflow_dispatch:
  push:
    paths: ["tools/osm/**"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool && pip install -q shapely
      - name: Extract from Geofabrik (osmium)
        working-directory: tools/osm
        run: python3 osm_places.py
      - uses: actions/upload-artifact@v4
        with:
          name: osm-places
          path: tools/osm/out/
          retention-days: 30
      - name: Publish CSV to branch osm-data
        working-directory: tools/osm/out
        run: |
          git init -q . && git checkout -q -b osm-data
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'ข้อมูล © OpenStreetMap contributors สัญญาอนุญาต ODbL https://www.openstreetmap.org/copyright\n' > SOURCE.txt
          git add -A && git commit -q -m "OSM places $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" osm-data
