# ดึงลานจอด ฮ./สนามบิน และยอดเขา (ประเทศไทย) จาก OpenStreetMap เป็น CSV (artifact) — ไม่เขียนลงรีโปหรือหน้าเว็บ
name: OSM places
on:
  workflow_dispatch:
  push:
    paths: ["tools/osm/**"]
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract from Overpass
        working-directory: tools/osm
        run: python3 osm_places.py
      - uses: actions/upload-artifact@v4
        with:
          name: osm-places
          path: tools/osm/out/
          retention-days: 30
